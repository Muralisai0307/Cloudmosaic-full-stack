name: Production Readiness CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-audit-and-test:
    name: Backend Audit & Tests (Linux)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cloudmosaic_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (libmagic)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libmagic-dev file

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r backend/requirements/production.txt

      - name: Run pip check
        run: |
          python -m pip check

      - name: Run pip-audit Security Scan
        run: |
          pip-audit -r backend/requirements/production.txt

      - name: Run Django System Checks & Migrations Dry-Run
        run: |
          cd backend
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run Django Deploy Check (Production Settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-deploy-check-key-with-sufficient-entropy-for-testing-1234567890
          ALLOWED_HOSTS: localhost,127.0.0.1,cloudmosaic.ai,api.cloudmosaic.ai
        run: |
          cd backend
          python manage.py check --deploy

      - name: Run Backend Test Suite
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cloudmosaic_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          SECRET_KEY: ci-test-key-with-sufficient-entropy-for-testing-purposes-1234567890
        run: |
          cd backend
          python manage.py test

  frontend-audit-and-build:
    name: Frontend Audit & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cloudmosaic-react-main/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd cloudmosaic-react-main
          npm ci --legacy-peer-deps

      - name: Run Frontend Audit
        run: |
          cd cloudmosaic-react-main
          npm audit --audit-level=critical

      - name: Build Frontend Static Bundle
        env:
          REACT_APP_API_URL: https://api.cloudmosaic.ai/api/v1
        run: |
          cd cloudmosaic-react-main
          npm run build

  docker-build-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-audit-and-test, frontend-audit-and-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: cloudmosaic-backend:ci-test

      - name: Build Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: false
          tags: cloudmosaic-nginx:ci-test
